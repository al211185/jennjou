<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vista previa del micrositio Rosalia</title>
  <desc id="desc">Composición inspirada en el sitio Rosalia con gradientes, tipografía y layout modular.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c1ff" />
      <stop offset="50%" stop-color="#ff7cc9" />
      <stop offset="100%" stop-color="#ff3e6c" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f021f" />
      <stop offset="100%" stop-color="#2b0738" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2ff" />
      <stop offset="100%" stop-color="#ffe4f3" />
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="url(#bg)" rx="48" />
  <g transform="translate(80,80)">
    <rect width="800" height="480" rx="32" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
    <rect x="40" y="40" width="360" height="400" rx="28" fill="url(#card)" />
    <rect x="60" y="80" width="320" height="200" rx="24" fill="#1d032a" stroke="#ff84d2" stroke-width="3" />
    <path d="M120 140c38-74 144-74 182 0" fill="none" stroke="#ffdee6" stroke-width="4" stroke-linecap="round" />
    <path d="M120 180c38-74 144-74 182 0" fill="none" stroke="#ff9ad6" stroke-width="4" stroke-linecap="round" />
    <text x="80" y="330" fill="#ffd8f3" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="48" font-weight="700">ROSALÍA</text>
    <text x="80" y="370" fill="#ffeff9" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="20" letter-spacing="4">MOTOMAMI WORLD</text>
    <rect x="440" y="80" width="300" height="60" rx="18" fill="url(#accent)" />
    <text x="470" y="120" fill="#d2187a" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="28" font-weight="600">Chronology</text>
    <rect x="440" y="170" width="300" height="60" rx="18" fill="url(#accent)" opacity="0.8" />
    <rect x="440" y="260" width="300" height="60" rx="18" fill="url(#accent)" opacity="0.6" />
    <rect x="440" y="350" width="300" height="60" rx="18" fill="url(#accent)" opacity="0.4" />
    <text x="60" y="40" fill="#ffeef9" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="20" letter-spacing="6">FAN EXPERIENCE</text>
    <circle cx="720" cy="60" r="10" fill="#ff7cda" />
    <circle cx="690" cy="60" r="10" fill="#ffd2f3" />
    <circle cx="660" cy="60" r="10" fill="#fff3fb" />
  </g>
</svg>
